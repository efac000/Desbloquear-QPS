name: QA do Desbloquear QPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-lua:
    name: Lua 5.1, DLL, arte e pacotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 python3-pil
      - name: Testes estáticos
        run: /usr/bin/python3 tools/test_release.py
      - name: Conferir pacotes distribuídos
        run: /usr/bin/python3 tools/gerar_pacotes.py --verificar

  qa-instalador:
    name: Instalador em Windows isolado
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar instalador sem tocar em jogos reais
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/instalar_local.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) { throw ($errors | Out-String) }
          $jogo=Join-Path $env:RUNNER_TEMP "DST-QPS-Test"
          New-Item -ItemType Directory -Force -Path (Join-Path $jogo "mods"),(Join-Path $jogo "bin64") | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File "tools/instalar_local.ps1" -PastaJogo $jogo -SomenteDLL
          if ($LASTEXITCODE -ne 0) { throw "Simulação falhou" }
          if (Test-Path (Join-Path $jogo "bin64/dinput8.dll")) { throw "A simulação escreveu a DLL" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "tools/instalar_local.ps1" -PastaJogo $jogo -SomenteDLL -Aplicar
          if ($LASTEXITCODE -ne 0) { throw "Instalação somente DLL falhou" }
          if (Test-Path (Join-Path $jogo "mods/desbloquear-qps")) { throw "Modo Workshop duplicou o mod" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "tools/instalar_local.ps1" -PastaJogo $jogo -Aplicar
          if ($LASTEXITCODE -ne 0) { throw "Instalação local falhou" }
          $mod=Join-Path $jogo "mods/desbloquear-qps/modmain.lua"
          if (!(Test-Path -LiteralPath $mod)) { throw "modmain.lua ausente" }
          $destino=Join-Path $jogo "bin64/dinput8.dll"
          if ((Get-FileHash $destino -Algorithm SHA256).Hash -ne (Get-FileHash "bin64/dinput8.dll" -Algorithm SHA256).Hash) { throw "DLL diferente" }
          Write-Host "PASS: simulação, somente DLL e instalação local"
          # Confere também o ZIP reduzido que os assinantes da Workshop vão baixar.
          $zip = "pacotes/Desbloquear-QPS-DLL-Windows-x64.zip"
          $extraido = Join-Path $env:RUNNER_TEMP "QPS-DLL-Standalone"
          Expand-Archive -LiteralPath $zip -DestinationPath $extraido
          $standalone = Join-Path $extraido "Desbloquear QPS"
          $instalador = Join-Path $standalone "tools/instalar_local.ps1"
          if (!(Test-Path -LiteralPath $instalador)) { throw "O ZIP da DLL não tem instalador" }
          $jogoDll = Join-Path $env:RUNNER_TEMP "DST-QPS-DLL-Only"
          New-Item -ItemType Directory -Force -Path (Join-Path $jogoDll "mods"),(Join-Path $jogoDll "bin64") | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File $instalador -PastaJogo $jogoDll -SomenteDLL -Aplicar
          if ($LASTEXITCODE -ne 0) { throw "Instalação do ZIP independente falhou" }
          if (Test-Path -LiteralPath (Join-Path $jogoDll "mods/desbloquear-qps")) { throw "ZIP de DLL duplicou o mod" }
          $dllNoJogo = Join-Path $jogoDll "bin64/dinput8.dll"
          if ((Get-FileHash -LiteralPath $dllNoJogo -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath "bin64/dinput8.dll" -Algorithm SHA256).Hash) { throw "DLL do ZIP independente divergente" }
          Write-Host "PASS: instalador do ZIP de DLL, sem cópia redundante do mod"
          # Instalação com o novo lançador de dois cliques (PowerShell interno).
          $novoWrapper = Join-Path $standalone "tools/instalar_workshop.ps1"
          $novoBat = Join-Path $standalone "INSTALAR DLL.bat"
          if (!(Test-Path -LiteralPath $novoWrapper) -or !(Test-Path -LiteralPath $novoBat)) { throw "Instalador automático ausente" }
          $astTokens=$null
          $astErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($novoWrapper, [ref]$astTokens, [ref]$astErrors) | Out-Null
          if (@($astErrors).Count -ne 0) { throw ($astErrors | Out-String) }
          $jogoAuto = Join-Path $env:RUNNER_TEMP "DST-QPS-AUTO"
          New-Item -ItemType Directory -Force -Path (Join-Path $jogoAuto "mods"),(Join-Path $jogoAuto "bin64") | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -STA -File $novoWrapper -PastaJogo $jogoAuto -Simular
          if ($LASTEXITCODE -ne 0) { throw "Simulação automática falhou" }
          if (Test-Path -LiteralPath (Join-Path $jogoAuto "bin64/dinput8.dll")) { throw "Simulação alterou a pasta" }
          & powershell -NoProfile -ExecutionPolicy Bypass -STA -File $novoWrapper -PastaJogo $jogoAuto
          if ($LASTEXITCODE -ne 0) { throw "Instalação automática falhou" }
          if ((Get-FileHash -LiteralPath (Join-Path $jogoAuto "bin64/dinput8.dll") -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath "bin64/dinput8.dll" -Algorithm SHA256).Hash) { throw "DLL automática divergente" }
          if (Test-Path -LiteralPath (Join-Path $jogoAuto "mods/desbloquear-qps")) { throw "Auto-instalação duplicou o mod" }
          Write-Host "PASS: lançador automático e simulação"

          $repeat = & powershell -NoProfile -ExecutionPolicy Bypass -STA -File $novoWrapper -PastaJogo $jogoAuto 2>&1
          if ($LASTEXITCODE -ne 0 -or ($repeat | Out-String) -notmatch 'JA ESTA ATUALIZADO COM SUCESSO') { throw 'Aviso de DLL atualizada ausente' }
          $foreign = Join-Path $jogoAuto 'bin64/dinput8.dll'
          [IO.File]::WriteAllText($foreign,'foreign fixture')
          $rejected = & powershell -NoProfile -ExecutionPolicy Bypass -STA -File $novoWrapper -PastaJogo $jogoAuto 2>&1
          if ($LASTEXITCODE -eq 0 -or [IO.File]::ReadAllText($foreign) -ne 'foreign fixture') { throw 'DLL desconhecida nao foi protegida' }
          Write-Host 'PASS: repeticao com DLL atual e recusa de DLL desconhecida'
          exit 0
