; DST HyperSmooth & FastLoad Native Companion Plugin Configuration (v2.5.0)
; Note: If you also use the Steam Workshop Companion Mod, in-game ESC->Settings->Graphics overrides these live.
[FPS]
target_fps=240

[OPTIMIZE]
high_res_timer=1
boost_priority=1
prewarm_bundles=1
rtss_frame_pacer=1
hybrid_frame_pacer=1
fast_mimalloc_lua=1
fast_vector_fill=1
fast_libdeflate_zip=1
fast_zlib_inflate=1
smooth_skeletal_anim=1
world_pos_interp=1
raknet_zero_stall=1
low_latency_gpu_sync=0
force_unsynced_presentation=1
smooth_lua_gc=1
fast_spatial_query=1
timeslice_tex_upload=1

[VISUAL]
; Player-First Default: 100% Vanilla Pure (all visual enhancements strictly opt-in)
anisotropic_filter=1
fullres_lightmap=0
hd2d_world_shaders=1
